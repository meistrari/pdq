name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with Type3 metrics
        run: cargo clippy --all-targets --features type3-metrics -- -D warnings

      - name: Check without default features
        run: cargo check --no-default-features --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install qpdf (test validator)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y qpdf
          else
            brew install qpdf
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests with default features
        run: cargo test --all-targets

      # The feature only changes `pdq text`; the library and text suites are
      # what it can reach.
      - name: Run text tests with Type3 metrics
        run: cargo test --features type3-metrics --lib --test text

      - name: Build release binary
        run: cargo build --release --bin pdq --features type3-metrics
